<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Math Whiz | Result</title><link rel="stylesheet" th:href="@{/css/style.css}"></head>
<body><div class="shell"><header><a class="brand" th:href="@{/}"><b>π</b> MATH WHIZ</a><a th:href="@{/leaderboard}">🏆 Leaderboard</a></header>
<main class="result"><small class="eyebrow">CHALLENGE COMPLETED</small><h1>Great effort, <em th:text="${playerName}">Player</em>!</h1>
<div class="scorebox"><div class="score" th:text="${score}+' / 10'">0 / 10</div><p th:text="${score==10?'Perfect score! You are a Math Whiz.':(score>=6?'Well done! Keep sharpening your skills.':'Good try! Practice makes progress.')}">Result</p></div>
<section class="panel review"><h2>Answer review</h2><div class="reviewrow" th:each="q,s : ${questions}"><span th:text="'Q'+(${s.index}+1)+' · '+${q.type}">Q1</span><b th:if="${correct[s.index]}" class="correct">✓ Correct</b><b th:unless="${correct[s.index]}" class="wrong">✕ Incorrect</b><span th:text="${correct[s.index]?q.marks:0}+'/'+${q.marks}+' marks'">0/2</span></div></section>
<div class="actions"><a class="button" th:href="@{/}">Play Again →</a><a class="secondary" th:href="@{/leaderboard}">View Leaderboard</a></div></main><footer>Your score has been saved to the Math Whiz database.</footer></div></body></html>
